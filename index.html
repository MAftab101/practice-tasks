<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Counter App</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="counter">
      <h4>Counter</h4>

      <h1>0</h1>
      <p class="message">Already zero</p>
      <div class="buttons">
        <button onclick="counter(event)" class="counter-btn">decrease</button>
        <button onclick="counter(event)" class="counter-btn">reset</button>
        <button onclick="counter(event)" class="counter-btn">increase</button>
      </div>
    </div>
    <div class="digital-clock">
      <h1 class="hours">10</h1>
      <h3>:</h3>
      <h1 class="minutes">: 20 :</h1>
      <h3>:</h3>
      <h1 class="seconds">33</h1>
    </div>
    <div class="date"></div>
    <button onclick="generateRandomNumber()" class="randomBtn">
      Generate Random
    </button>
    <p class="random"></p>
    <script src="script.js"></script>
  </body>
</html>
